worker_processes auto;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    aio           threads;
    keepalive_timeout 65;
    server_tokens off;

    # HLS-плейлисты сегментов — текст до ~100 КБ на час записи, хорошо сжимается
    gzip on;
    gzip_proxied any;
    gzip_types application/vnd.apple.mpegurl application/json text/css application/javascript;

    log_format main '$remote_addr $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time "$http_range"';
    access_log /var/log/nginx/access.log main;

    upstream api { server api:8000; keepalive 16; }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Базовая аутентификация (опционально): раскомментируйте и создайте htpasswd.
        # Имя пользователя передаётся в API для аудита просмотров и выгрузок.
        # auth_basic           "TS Archive";
        # auth_basic_user_file /etc/nginx/htpasswd;

        location / { try_files $uri $uri/ /index.html; }
        location /vendor/ { add_header Cache-Control "public, max-age=604800"; }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Remote-User $remote_user;
            proxy_read_timeout 600s;          # выгрузки длинных интервалов
            client_max_body_size 1m;
        }
        location = /metrics { proxy_pass http://api; }

        # Раздача файлов архива только по X-Accel-Redirect из API (после проверки прав).
        # Плеер читает исходные TS кусками (HLS byte-range): Range-запросы обрабатывает Nginx
        # через sendfile, API только проверяет доступ. Cache-Control приходит от API.
        location /protected/ {
            internal;
            alias /archive/;
            types { video/mp4 mp4; video/mp2t ts; image/jpeg jpg; }
        }
    }
}
